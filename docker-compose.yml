version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: anime_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # auto-runs migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime_backend
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    environment:
      PORT:        ${PORT}
      GIN_MODE:    ${GIN_MODE}
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
      DB_SSLMODE:  ${DB_SSLMODE}
      JWT_SECRET:  ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy  # waits for DB to be ready before starting
    volumes:
      - .:/app  # live reload in dev

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: anime_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules  # prevents host node_modules from overwriting container's
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:  # persists DB data between container restarts
